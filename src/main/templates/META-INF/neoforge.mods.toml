modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="cinematic_logo.png"

[[mixins]]
config="cinematicpenchant.mixins.json"

[[mixins]]
config="cinematicpenchant.client.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="penchant"
type="required"
versionRange="[${penchant_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cinematic"
type="required"
versionRange="[${cinematic_version},)"
ordering="AFTER"
side="BOTH"
